  <meta name="description" content="Aplicación para registrar gastos e ingresos, fijar presupuestos mensuales y seguir tus objetivos de ahorro.">

  <!-- Instalación en iOS. Safari ignora el manifiesto para el icono y el
       nombre de la pantalla de inicio, así que hay que dárselos aparte. -->
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Eurcontroller">
  <!-- «default» y no «black-translucent»: con la barra translúcida el texto de
       estado es siempre blanco y resultaría ilegible en tema claro. Con este
       valor, iOS 15+ colorea la barra según <meta name="theme-color">, que el
       propio cambio de tema mantiene actualizado. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Eurcontroller">

  <link rel="stylesheet" href="assets/css/app.css">

  <!-- Se aplica el tema antes de pintar: sin esto, un usuario con tema oscuro
       vería un fogonazo blanco en cada carga. -->
  <script>
    (function () {
      var guardado = localStorage.getItem('eurc_tema') || 'sistema';
      var oscuro = guardado === 'oscuro'
        || (guardado === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
      document.documentElement.style.background = oscuro ? '#070b14' : '#f4f6fb';
      document.querySelector('meta[name="theme-color"]').content = oscuro ? '#070b14' : '#f4f6fb';
    })();
  </script>
